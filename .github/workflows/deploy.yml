name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The portal's database keys come from .env.production, or from repository variables if those are set
      # (Settings → Secrets and variables → Actions → Variables). Neither = the portal runs in preview mode.
      - run: |
          if [ -n "$U" ]; then export VITE_SUPABASE_URL="$U"; fi
          if [ -n "$K" ]; then export VITE_SUPABASE_ANON_KEY="$K"; fi
          VITE_BASE=/Jeevunjee-site/ npm run build
        env:
          U: ${{ vars.VITE_SUPABASE_URL }}
          K: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Lets GitHub Pages serve deep links and unknown paths without a bare 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
