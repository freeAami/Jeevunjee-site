name: Keep Supabase awake

# Free Supabase projects pause after a week with no activity. A tiny request twice a week prevents that.
on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] && [ -f .env.production ]; then
            URL=$(grep -E '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
            KEY=$(grep -E '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          fi
          if [ -z "$URL" ]; then echo "Supabase isn't connected yet — nothing to do."; exit 0; fi
          curl -fsS "$URL/rest/v1/trusts?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          echo "Pinged $URL"
